crons:
  - name: daily-pickup-remind
    description: "Sends daily cotton box pickup reminders (email + WhatsApp) for overdue/due shops at 9am IST"
    cron: "0 9 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: overdue-nudge
    description: "Second alert that re-pings only shops still overdue for 2+ days, daily at 9:30am IST"
    cron: "30 9 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/overdue-nudge"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
